[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "broute-j11"
version = "0.1.0"
description = "Python library for RATOC RS-WSUHA-J11 B-route smart meter adapters"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "jethac" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "mypy>=1.17",
    "PyYAML>=6.0.2",
    "pytest>=8.4",
    "pytest-asyncio>=0.26",
    "pytest-cov>=6.2",
    "ruff>=0.12",
    "twine>=6.1",
    "types-PyYAML>=6.0.12",
    "types-pyserial>=3.5",
]

[project.urls]
Homepage = "https://github.com/jethac/broute-j11"
Repository = "https://github.com/jethac/broute-j11"
Issues = "https://github.com/jethac/broute-j11/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["broute_j11"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
